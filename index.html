            class="w-full h-full object-cover group-hover:scale-[1.03] transition duration-500"
            onerror="handleImgError(this, '${esc(src)}', '${esc(caption)}')"
          />
          ${
            badge
              ? `<span class="absolute bottom-2 left-2 px-2.5 py-1 rounded-full bg-ivory/90 backdrop-blur-sm border border-borderWarm text-[11px] font-serifTC font-bold text-ink shadow-sm">${esc(badge)}</span>`
              : ''
          }
        </div>
      `;
    }

    function openLightbox(src, caption) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').textContent = caption;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      el.classList.remove('opacity-0', 'translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__tTimer);
      window.__tTimer = setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', 'translate-y-2');
      }, 2400);
    }

    function openConfirm(title, msg, onYes) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      confirmHandler = onYes;
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function resolveConfirm(yes) {
      document.getElementById('confirmModal').classList.add('hidden');
      if (yes && typeof confirmHandler === 'function') confirmHandler();
      confirmHandler = null;
    }

    function dividerSVG() {
      return `

      document.querySelectorAll('.mobile-tab').forEach((btn) => {

        btn.className = on
          ? 'mobile-tab flex flex-col items-center gap-0.5 py-1.5 rounded-xl bg-gold/20 text-ink font-bold transition'
          : 'mobile-tab flex flex-col items-center gap-0.5 py-1.5 rounded-xl text-sepia transition';

      if (activeTab === 'itinerary') renderItinerary();

    const CUISINE_LIST = [
      '全部',
      '水炊鍋・壽喜燒',
      '拉麵',
      '燒鳥・居酒屋',
      '鐵板燒・和食・海鮮',
      '天婦羅',
      '甜點・咖啡・伴手禮'
    ];

    function setRestRegion(r) {
      restRegion = r;
      renderRestaurants();
    }

    function setRestCuisine(c) {
      restCuisine = c;
      renderRestaurants();
    }

    function onRestSearch(val) {
      restSearch = val;
      renderRestaurantCardsOnly();
    }

    function getFilteredRestaurants() {
      const q = restSearch.trim().toLowerCase();
      return RESTAURANTS.filter((r) => {
        const mReg = restRegion === '全部' || r.region === restRegion;
        const mCui = restCuisine === '全部' || r.cuisine === restCuisine;
        const mQ =
          !q ||
          r.name.toLowerCase().includes(q) ||
          r.note.toLowerCase().includes(q) ||
          r.cuisine.toLowerCase().includes(q) ||
          r.region.toLowerCase().includes(q);
        return mReg && mCui && mQ;
      });
    }

    function buildRestaurantCards(list) {
      if (!list.length) {
        return `<div class="col-span-full journal-card rounded-2xl p-8 text-center text-sm text-sepia">沒有符合條件的餐廳，請試試其他分類或關鍵字。</div>`;

      return list
        .map(
          (r) => `

              </div>
              <div class="flex flex-wrap gap-1.5 mt-2">
                <span class="px-2 py-0.5 rounded-full bg-paperDeep border border-borderWarm text-[10px] text-sepia">${esc(r.region)}</span>
                <span class="px-2 py-0.5 rounded-full bg-moss/15 text-moss text-[10px] font-medium">${esc(r.cuisine)}</span>
                <span class="px-2 py-0.5 rounded-full bg-paperDeep text-sepia text-[10px]">${esc(r.price)}</span>

                📍 Google Maps 搜尋
              </a>
            </div>
          </div>
        `
        )

    function renderRestaurantCardsOnly() {

    function renderRestaurants() {

        <div class="space-y-5 fade-in">

    /* =========================================================================
       8. TAB 3: 3-PERSON BUDGET TRACKER (JPY/TWD + JSON BACKUP)
       ========================================================================= */
    const BUDGET_CATS = ['餐飲', '交通包車', '住宿', '景點門票', '購物伴手禮'];
    const PAYERS = ['我', '爸爸', '媽媽'];

    function toTWD(amt, cur) {
      const n = Number(amt) || 0;
      return cur === 'JPY' ? Math.round(n * budgetState.rate) : Math.round(n);
    }

    function updateRate(val) {
      const n = parseFloat(val);
      if (n > 0 && n < 5) {
        budgetState.rate = n;
        saveBudgetState();
        renderBudget();
      }
    }

    function addBudgetItem(e) {
      e.preventDefault();
      const name = document.getElementById('bName').value.trim();
      const amount = parseFloat(document.getElementById('bAmount').value);
      if (!name || isNaN(amount) || amount <= 0) {
        showToast('請輸入正確的項目名稱與金額');
        return;
      }
      budgetState.items.unshift({
        id: 'b-' + Date.now(),
        day: document.getElementById('bDay').value,
        category: document.getElementById('bCat').value,
        name,
        amount,
        currency: document.getElementById('bCur').value,
        payer: document.getElementById('bPayer').value
      });
      saveBudgetState();
      renderBudget();
      showToast('💴 已新增一筆支出');
    }

    function removeBudgetItem(id) {
      openConfirm('刪除支出', '確定要刪除這筆支出紀錄嗎？', () => {
        budgetState.items = budgetState.items.filter((x) => x.id !== id);
        saveBudgetState();
        renderBudget();
        showToast('已刪除支出');
      });
    }

    function exportBudgetJSON() {
      const blob = new Blob([JSON.stringify(budgetState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kyushu-budget-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('⬇️ 記帳備份檔已匯出');
    }

    function importBudgetJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.items)) {
            budgetState = { rate: Number(parsed.rate) || 0.215, items: parsed.items };
            saveBudgetState();
            renderBudget();
            showToast('✅ 記帳備份已還原');
          } else {
            showToast('⚠️ 檔案格式不符');
          }
        } catch {
          showToast('⚠️ 無法解析 JSON 檔案');
        }
      };
      reader.readAsText(file);
    }

    function renderBudget() {
      let totalTWD = 0;
      let sumJPY = 0;
      let sumTWD = 0;
      const catTotals = {};
      BUDGET_CATS.forEach((c) => (catTotals[c] = 0));

      budgetState.items.forEach((item) => {
        const twd = toTWD(item.amount, item.currency);
        totalTWD += twd;
        if (item.currency === 'JPY') sumJPY += Number(item.amount) || 0;
        else sumTWD += Number(item.amount) || 0;
        catTotals[item.category] = (catTotals[item.category] || 0) + twd;
      });

      const perPerson = Math.round(totalTWD / 3);

      const html = `
        <div class="space-y-6 fade-in">
          <section class="journal-card rounded-3xl p-5 sm:p-6 shadow-journal">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="font-editorial text-xs tracking-[0.24em] text-gold uppercase">FAMILY LEDGER</p>
                <h1 class="font-serifTC text-2xl sm:text-3xl font-bold text-ink mt-1">三人旅費記帳本</h1>
                <p class="text-xs sm:text-sm text-sepia mt-1">日幣 / 台幣雙幣別自動換算，資料自動儲存於本機並支援 JSON 備份還原。</p>
              </div>
              <div class="flex items-center gap-2 bg-paperDeep px-3.5 py-2 rounded-2xl border border-borderWarm self-start">
                <span class="text-xs text-sepia">1 JPY =</span>
                <input type="number" step="0.001" min="0.01" max="5" value="${budgetState.rate}" onchange="updateRate(this.value)" class="w-20 px-2 py-1 rounded-lg bg-ivory border border-gold text-sm font-bold text-ink text-center" />
                <span class="text-xs text-sepia">TWD</span>
              </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
              <div class="p-4 rounded-2xl bg-ink text-ivory">
                <p class="text-[11px] opacity-80">折合台幣總計</p>
                <p class="font-editorial text-3xl font-bold mt-1">NT$ ${totalTWD.toLocaleString()}</p>
                <p class="text-[11px] opacity-75 mt-1">三人平均每人 NT$ ${perPerson.toLocaleString()}</p>
              </div>
              <div class="p-4 rounded-2xl bg-paperDeep border border-borderWarm">
                <p class="text-[11px] text-sepia">原始幣別累積</p>
                <p class="text-sm font-bold text-ink mt-1.5">🇯🇵 ¥ ${Math.round(sumJPY).toLocaleString()}</p>
                <p class="text-sm font-bold text-ink mt-1">🇹🇼 NT$ ${Math.round(sumTWD).toLocaleString()}</p>
              </div>
              <div class="p-4 rounded-2xl bg-paperDeep border border-borderWarm flex flex-col justify-between gap-2">
                <p class="text-[11px] text-sepia">備份與跨裝置還原</p>
                <div class="flex gap-2">
                  <button onclick="exportBudgetJSON()" class="flex-1 py-2 px-2.5 rounded-xl bg-ivory border border-borderWarm text-xs text-ink font-medium hover:border-gold transition">⬇️ 匯出 JSON</button>
                  <label class="flex-1 py-2 px-2.5 rounded-xl bg-ivory border border-borderWarm text-xs text-ink font-medium text-center cursor-pointer hover:border-gold transition">
                    ⬆️ 匯入還原
                    <input type="file" accept=".json" onchange="importBudgetJSON(event)" class="hidden" />
                  </label>
                </div>
              </div>
            </div>

            <!-- Category Breakdown -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mt-4">
              ${BUDGET_CATS.map((cat) => {
                const val = catTotals[cat] || 0;
                const pct = totalTWD > 0 ? Math.round((val / totalTWD) * 100) : 0;
                return `
                  <div class="p-3 rounded-xl bg-ivory border border-borderWarm/70">
                    <div class="flex justify-between text-[11px]">
                      <span class="text-sepia">${cat}</span>
                      <span class="text-ink font-medium">${pct}%</span>
                    </div>
                    <p class="text-xs sm:text-sm font-bold text-ink mt-1">NT$ ${val.toLocaleString()}</p>
                    <div class="w-full h-1.5 bg-paperDeep rounded-full mt-1.5 overflow-hidden">
                      <div class="h-full bg-maple/80 rounded-full" style="width:${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Add Expense Form -->
          <section class="journal-card rounded-2xl p-5 shadow-soft">
            <h2 class="font-serifTC text-base font-bold text-ink mb-3">＋ 新增支出</h2>
            <form onsubmit="addBudgetItem(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 text-xs sm:text-sm">
              <div class="lg:col-span-2">
                <input id="bName" required type="text" placeholder="項目名稱（如：勝烈亭炸豬排）" class="w-full px-3 py-2 rounded-xl bg-paperDeep border border-borderWarm focus:outline-none focus:border-ink" />
              </div>
              <select id="bCat" class="px-3 py-2 rounded-xl bg-paperDeep border border-borderWarm">
                ${BUDGET_CATS.map((c) => `<option value="${c}">${c}</option>`).join('')}
              </select>
              <select id="bDay" class="px-3 py-2 rounded-xl bg-paperDeep border border-borderWarm">
                <option value="行前預付">行前預付</option>
                <option value="Day 1">Day 1 (11/23)</option>
                <option value="Day 2">Day 2 (11/24)</option>
                <option value="Day 3">Day 3 (11/25)</option>
                <option value="Day 4">Day 4 (11/26)</option>
                <option value="Day 5">Day 5 (11/27)</option>
                <option value="Day 6">Day 6 (11/28)</option>
              </select>
              <div class="flex gap-1.5">
                <input id="bAmount" required type="number" step="any" min="1" placeholder="金額" class="w-full px-2.5 py-2 rounded-xl bg-paperDeep border border-borderWarm" />
                <select id="bCur" class="px-2 py-2 rounded-xl bg-paperDeep border border-borderWarm text-xs">
                  <option value="JPY">JPY</option>
                  <option value="TWD">TWD</option>
                </select>
              </div>
              <div class="flex gap-2">
                <select id="bPayer" class="px-2.5 py-2 rounded-xl bg-paperDeep border border-borderWarm">
                  ${PAYERS.map((p) => `<option value="${p}">${p}</option>`).join('')}
                </select>
                <button type="submit" class="flex-1 px-4 py-2 rounded-xl bg-ink text-ivory font-medium hover:bg-ink/90 transition">加入</button>
              </div>
            </form>
          </section>

          <!-- Expense List -->
          <section class="journal-card rounded-2xl p-5 shadow-soft">
            <h2 class="font-serifTC text-base font-bold text-ink mb-3">支出明細（共 ${budgetState.items.length} 筆）</h2>
            ${
              budgetState.items.length === 0
                ? `<p class="text-xs text-sepia py-6 text-center">尚無支出紀錄，請從上方新增第一筆花費。</p>`
                : `
              <div class="divide-y divide-borderWarm/60">
                ${budgetState.items
                  .map((item) => {
                    const twd = toTWD(item.amount, item.currency);
                    return `
                      <div class="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div class="flex flex-wrap items-center gap-1.5 text-[10px]">
                            <span class="px-2 py-0.5 rounded-full bg-gold/20 text-ink">${esc(item.category)}</span>
                            <span class="text-sepia">${esc(item.day)}</span>
                            <span class="px-2 py-0.5 rounded-full bg-paperDeep border border-borderWarm text-sepia">付款：${esc(item.payer)}</span>
                          </div>
                          <p class="font-serifTC font-bold text-ink text-sm mt-1">${esc(item.name)}</p>
                        </div>
                        <div class="flex items-center gap-3">
                          <div class="text-right">
                            <p class="text-sm font-bold text-ink">
                              ${item.currency === 'JPY' ? `¥ ${Number(item.amount).toLocaleString()}` : `NT$ ${Number(item.amount).toLocaleString()}`}
                            </p>
                            ${item.currency === 'JPY' ? `<p class="text-[11px] text-sepia">≈ NT$ ${twd.toLocaleString()}</p>` : ''}
                          </div>
                          <button onclick="removeBudgetItem('${item.id}')" class="px-2.5 py-1 rounded-lg border border-borderWarm text-xs text-maple hover:bg-maple/10">刪</button>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            `
            }
          </section>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
    }

    /* =========================================================================
       9. TAB 4: LIVE WEATHER (OPEN-METEO API)
       ========================================================================= */
    function codeToWeather(code) {
      if (code === 0) return { icon: '☀️', text: '晴朗' };
      if ([1, 2, 3].includes(code)) return { icon: '⛅', text: '多雲時晴' };
      if ([45, 48].includes(code)) return { icon: '🌫️', text: '有霧' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: '🌧️', text: '有雨' };
      if ([71, 73, 75, 85, 86].includes(code)) return { icon: '❄️', text: '降雪' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: '雷陣雨' };
      return { icon: '🌤️', text: '多雲' };
    }

    async function fetchWeather(force = false) {
      if (weatherCache && !force) return weatherCache;
      const results = await Promise.all(
        WEATHER_CITIES.map(async (c) => {
          try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network');
            const data = await res.json();
            return { ...c, ok: true, data };
          } catch {
            return { ...c, ok: false };
          }
        })
      );
      weatherCache = results;
      return results;
    }

    async function renderWeather(force = false) {
      document.getElementById('app').innerHTML = `
        <div class="space-y-6 fade-in">
          <section class="journal-card rounded-3xl p-5 sm:p-6 shadow-journal flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <p class="font-editorial text-xs tracking-[0.24em] text-gold uppercase">LIVE WEATHER</p>
              <h1 class="font-serifTC text-2xl sm:text-3xl font-bold text-ink mt-1">九州五大區域・即時天氣</h1>
              <p class="text-xs sm:text-sm text-sepia mt-1">即時串接 Open-Meteo 氣象資料，掌握平地與阿蘇、由布院山區溫差。</p>
            </div>
            <button onclick="renderWeather(true)" class="self-start sm:self-auto px-4 py-2 rounded-full border border-borderWarm bg-paperDeep text-xs text-ink hover:border-gold transition">
              🔄 重新整理
            </button>
          </section>

          <div id="weatherCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-10 text-sm text-sepia">正在讀取九州即時天氣...</div>
          </div>

          <section class="journal-card rounded-2xl p-5 shadow-soft">
            <h2 class="font-serifTC text-base font-bold text-ink mb-2">🧥 11 月底九州深秋穿搭建議</h2>
            <ul class="text-xs sm:text-sm text-sepia space-y-1.5 list-disc pl-4 leading-relaxed">
              <li><strong class="text-ink">洋蔥式穿搭：</strong>福岡與熊本市區白天約 14–18°C，室內與包車內暖氣足，內層建議好穿脫的發熱衣或薄針織衫。</li>
              <li><strong class="text-ink">山區防風保暖：</strong>由布院清晨（金鱗湖）、阿蘇大觀峰與高千穗峽谷氣溫可能降至 4–8°C 且風勢較強，務必備妥防風羽絨外套、圍巾與毛帽。</li>
              <li><strong class="text-ink">好走防滑鞋：</strong>神社石階與峽谷步道早晨易有露水，建議穿著鞋底防滑的健走鞋或慢跑鞋。</li>
            </ul>
          </section>
        </div>
      `;

      const dataList = await fetchWeather(force);
      const container = document.getElementById('weatherCards');
      if (!container) return;

      container.innerHTML = dataList
        .map((c) => {
          if (!c.ok) {
            return `
              <div class="journal-card rounded-2xl p-5 shadow-soft">
                <h3 class="font-serifTC text-base font-bold text-ink">${esc(c.name)}</h3>
                <p class="text-xs text-sepia">${esc(c.sub)}</p>
                <p class="text-xs text-maple mt-3">暫時無法連線取得即時氣象，請稍後再試。</p>
              </div>
            `;
          }
          const cur = c.data.current;
          const d = c.data.daily;
          const w = codeToWeather(cur.weather_code);
          return `
            <div class="journal-card rounded-2xl p-5 shadow-soft">
              <div class="flex items-start justify-between">
                <div>
                  <h3 class="font-serifTC text-lg font-bold text-ink">${esc(c.name)}</h3>
                  <p class="text-xs text-sepia">${esc(c.sub)}</p>
                </div>
                <span class="text-3xl">${w.icon}</span>
              </div>
              <div class="mt-3 flex items-baseline gap-2">
                <span class="font-editorial text-4xl font-bold text-ink">${Math.round(cur.temperature_2m)}°C</span>
                <span class="text-xs text-sepia">${w.text}</span>
              </div>
              <div class="mt-3 pt-3 border-t border-borderWarm/60 flex items-center justify-between text-xs text-sepia">
                <span>高/低溫：${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</span>
                <span>💧 降雨機率 ${d.precipitation_probability_max?.[0] ?? '—'}%</span>
              </div>
            </div>
          `;
        })
        .join('');
    }

    /* =========================================================================
       10. INIT
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      updateNavUI();
      renderApp();
    });
  </script>
