<body class="min-h-screen pb-24 md:pb-12">

        </div>
      </button>

    <div class="grid grid-cols-5 text-[11px] py-1.5 px-1">

      </button>
      <button data-mnav="day" onclick="navigateTo('day', currentDay)" class="mnav-btn flex flex-col items-center gap-0.5 py-1 rounded-xl">
        <span class="text-base">🗓️</span><span>每日行程</span>
      </button>
      <button data-mnav="restaurants" onclick="navigateTo('restaurants')" class="mnav-btn flex flex-col items-center gap-0.5 py-1 rounded-xl">

        <span class="text-base">⛅</span><span>即時天氣</span>
      </button>
    </div>

    <div class="editorial-card rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-journal max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 id="restModalTitle" class="font-serifTC text-lg font-bold text-navy">新增私房餐廳</h3>
        <button onclick="closeRestaurantModal()" class="w-8 h-8 rounded-full border border-borderWarm text-sepia hover:text-navy">✕</button>
      </div>
      <form id="restaurantForm" onsubmit="saveRestaurantForm(event)" class="space-y-3 text-sm">
        <input type="hidden" id="restId" />
        <div>
          <label class="block text-xs text-sepia mb-1">餐廳名稱 *</label>
          <input id="restName" required type="text" placeholder="例如：博多一雙、勝烈亭" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-sepia mb-1">所屬區域 *</label>
            <select id="restRegion" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy">
              <option value="福岡">福岡</option>
              <option value="由布院・阿蘇">由布院・阿蘇</option>
              <option value="熊本・高千穗">熊本・高千穗</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-sepia mb-1">料理分類 *</label>
            <select id="restCuisine" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy">
              <option value="水炊鍋・壽喜燒">水炊鍋・壽喜燒</option>
              <option value="天婦羅">天婦羅</option>
              <option value="燒鳥・居酒屋">燒鳥・居酒屋</option>
              <option value="拉麵">拉麵</option>
              <option value="鐵板燒・和食・海鮮">鐵板燒・和食・海鮮</option>
              <option value="甜點・咖啡・伴手禮">甜點・咖啡・伴手禮</option>
              <option value="超市・百貨採買">超市・百貨採買</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-sepia mb-1">價格區間</label>
            <input id="restPrice" type="text" placeholder="例如：¥2,000 – ¥4,000" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />

            <label class="block text-xs text-sepia mb-1">Google 評分（選填）</label>
            <input id="restRating" type="text" placeholder="例如：★4.6 (356)" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-sepia mb-1">營業時間</label>
            <input id="restHours" type="text" placeholder="待確認" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />

          <div>
            <label class="block text-xs text-sepia mb-1">公休日</label>
            <input id="restClosed" type="text" placeholder="待確認" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />

        </div>
        <div>
          <label class="block text-xs text-sepia mb-1">推薦餐點 / 筆記</label>
          <input id="restDishes" type="text" placeholder="例如：特選里肌豬排、招牌拉麵" class="w-full px-3 py-2 rounded-xl bg-paper border border-borderWarm focus:outline-none focus:border-navy" />

    <div class="editorial-card rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-journal">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-serifTC text-lg font-bold text-navy">資料備份與還原</h3>

      </div>

      </p>
      <div class="space-y-2.5">
        <button onclick="exportBackupJSON()" class="w-full py-2.5 px-4 rounded-xl bg-navy text-ivory text-sm font-medium hover:bg-navy/90 transition">
          ⬇️ 匯出備份檔 (.json)
        </button>
        <label class="block w-full py-2.5 px-4 rounded-xl border border-gold bg-paper text-navy text-sm font-medium text-center cursor-pointer hover:bg-gold/10 transition">
          ⬆️ 選擇備份檔還原 (.json)
          <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden" />
        </label>
        <button onclick="confirmResetAll()" class="w-full py-2 px-4 rounded-xl border border-terracotta/40 text-terracotta text-xs hover:bg-terracotta/10 transition">
          重置為初始預設資料
        </button>
      </div>
    </div>
  </div>

    /* =========================================================================
       2. 狀態管理與 localStorage 持久化
       ========================================================================= */
    const STORAGE_KEY = "kyushu_journal_2026_final_v1";
    let currentView = "home";
    let currentDay = 1;
    let selectedRegion = "全部";
    let selectedCuisine = "全部";
    let restaurantSearchQuery = "";
    let editingExpenseId = null;
    let confirmCallback = null;
    let weatherCache = null;

    function createInitialState() {
      return {
        exchangeRate: 0.215,
        travelers: [...DEFAULT_TRIP_DATA.meta.travelersDefault],
        expenses: JSON.parse(JSON.stringify(DEFAULT_TRIP_DATA.sampleExpenses)),
        resolvedConflicts: {},
        dailyMemos: {},
        customRestaurants: [],
        hiddenDefaultRestaurants: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        return { ...createInitialState(), ...JSON.parse(raw) };
      } catch (err) {
        return createInitialState();
      }
    }

    let appState = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        showToast("⚠️ 瀏覽器儲存空間不足，建議匯出備份檔");
      }
    }

    /* =========================================================================
       3. 共用工具與圖片優雅降級（onerror 水彩提示）
       ========================================================================= */
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function handleImgFallback(imgEl, filenameHint, titleHint) {
      if (!imgEl || !imgEl.parentElement) return;
      imgEl.parentElement.innerHTML = `
        <div class="w-full h-full watercolor-fallback flex flex-col items-center justify-center p-4 text-center">
          <span class="text-2xl mb-1.5 opacity-80">🖼️</span>
          <p class="font-serifTC text-xs sm:text-sm font-bold text-navy">${escapeHtml(titleHint || "實景照片預覽區")}</p>
          <p class="text-[11px] text-sepia mt-1 font-mono bg-ivory/80 px-2.5 py-0.5 rounded-full border border-borderWarm">${escapeHtml(filenameHint)}</p>
          <p class="text-[10px] text-sepia/80 mt-1.5">上傳至 GitHub 同資料夾後即自動顯示</p>
        </div>
      `;
    }

    function renderImageBox(src, alt, aspectClass = "aspect-[16/10]", badgeText = "") {
      const safeSrc = escapeHtml(src);
      const safeAlt = escapeHtml(alt);
      return `
        <div class="relative rounded-xl overflow-hidden border border-borderWarm/80 ${aspectClass} bg-paperDeep shadow-soft">
          <img
            src="${safeSrc}"
            alt="${safeAlt}"
            loading="lazy"
            class="w-full h-full object-cover"
            onerror="handleImgFallback(this, '${safeSrc}', '${safeAlt}')"
          />
          ${
            badgeText
              ? `<span class="absolute bottom-2 left-2 px-2.5 py-1 rounded-full bg-ivory/90 backdrop-blur-sm border border-borderWarm text-[11px] font-serifTC font-bold text-navy shadow-sm">${escapeHtml(badgeText)}</span>`
              : ""
          }
        </div>
      `;
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const txt = document.getElementById("toastText");
      txt.textContent = msg;
      box.classList.remove("opacity-0", "translate-y-2");
      box.classList.add("opacity-100", "translate-y-0");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.remove("opacity-100", "translate-y-0");
        box.classList.add("opacity-0", "translate-y-2");
      }, 2600);
    }

    function openConfirmModal(title, message, onConfirm) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMessage").textContent = message;
      confirmCallback = onConfirm;
      document.getElementById("confirmModal").classList.remove("hidden");
    }

    function closeConfirmModal(confirmed) {
      document.getElementById("confirmModal").classList.add("hidden");
      if (confirmed && typeof confirmCallback === "function") confirmCallback();
      confirmCallback = null;
    }

      return `

          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">

          </svg>
          <span class="h-px w-12 sm:w-20 bg-borderWarm"></span>
        </div>
      `;

      const icons = {
        plane: "✈️", car: "🚐", boat: "🚣", leaf: "🍁", hotel: "🏨",
        walk: "🌿", food: "🍲", bag: "🛍️", sparkle: "✨", water: "💧",
        camera: "📷", mountain: "⛰️", train: "🚂", torii: "⛩️", bus: "🚌"
      };
      return icons[type] || "📍";
    }

    /* =========================================================================
       4. 路由與導覽切換
       ========================================================================= */
    function navigateTo(view, dayNum = currentDay) {
      currentView = view;
      if (view === "day") currentDay = dayNum;
      updateNavStyles();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateNavStyles() {
      document.querySelectorAll(".nav-pill").forEach((btn) => {
        const active = btn.dataset.nav === currentView;
        btn.className = active
          ? "nav-pill px-3.5 py-1.5 rounded-full bg-navy text-ivory font-medium shadow-sm transition"
          : "nav-pill px-3.5 py-1.5 rounded-full text-sepia hover:text-navy hover:bg-gold/15 transition";
      });

      document.querySelectorAll(".mnav-btn").forEach((btn) => {
        const active = btn.dataset.mnav === currentView;
        btn.className = active
          ? "mnav-btn flex flex-col items-center gap-0.5 py-1 rounded-xl text-navy font-bold bg-gold/20"
          : "mnav-btn flex flex-col items-center gap-0.5 py-1 rounded-xl text-sepia";
      });

      const subNav = document.getElementById("daySubNav");
      if (currentView === "day") {
        subNav.classList.remove("hidden");
        document.getElementById("daySubNavButtons").innerHTML = DEFAULT_TRIP_DATA.days
          .map((d) => {
            const isActive = d.day === currentDay;
            return `
              <button onclick="navigateTo('day', ${d.day})" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs border transition ${
                isActive
                  ? "bg-navy text-ivory border-navy font-medium shadow-sm"
                  : "bg-paper text-sepia border-borderWarm hover:border-gold hover:text-navy"
              }">
                DAY ${d.day}｜${d.date.split(" ")[0]}
              </button>
            `;
          })
          .join("");
      } else {
        subNav.classList.add("hidden");
      }
    }

    function renderCurrentView() {
      if (currentView === "home") renderHome();
      else if (currentView === "day") renderDay(currentDay);
      else if (currentView === "restaurants") renderRestaurants();
      else if (currentView === "budget") renderBudget();
      else if (currentView === "weather") renderWeather();
    }

    /* =========================================================================
       5. 視圖一：首頁 (Home)
       ========================================================================= */
    function renderCountdownHTML() {
      const now = new Date();
      const dep = new Date(DEFAULT_TRIP_DATA.meta.departureISO);
      const end = new Date(DEFAULT_TRIP_DATA.meta.tripEndISO);
      const diffMs = dep - now;

      if (diffMs > 0) {
        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
        return `
          <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-paper border border-gold/60 shadow-soft text-xs sm:text-sm">
            <span class="text-sepia">距離九州出發還有</span>
            <span class="font-editorial text-xl sm:text-2xl font-bold text-terracotta">${days}</span>
            <span class="text-sepia">天</span>
            <span class="font-editorial text-lg font-bold text-navy">${hours}</span>
            <span class="text-sepia">小時</span>
          </div>
        `;
      } else if (now <= end) {
        const dayIndex = Math.min(6, Math.max(1, Math.floor((now - dep) / (1000 * 60 * 60 * 24)) + 1));
        return `
          <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-sage/15 border border-sage/40 text-sage text-xs sm:text-sm font-medium">
            🍁 旅程進行中・目前為 DAY ${dayIndex}
          </div>
        `;
      }
      return `
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-gold/15 border border-gold/50 text-sepia text-xs sm:text-sm">
          ✨ 2026 九州秋日家族慢旅・美好回憶珍藏
        </div>
      `;
    }

    function buildDayRouteUrl(waypoints) {
      if (!waypoints || waypoints.length < 2) return "https://www.google.com/maps";
      const origin = encodeURIComponent(waypoints[0]);
      const dest = encodeURIComponent(waypoints[waypoints.length - 1]);
      const mids = waypoints.slice(1, -1).map(encodeURIComponent).join("|");
      return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}${mids ? `&waypoints=${mids}` : ""}&travelmode=driving`;
    }

    /* =========================================================================
       7. 視圖三：餐廳專區 (Region + Category + Search，純文字卡片)
       ========================================================================= */
    const REGIONS = ["全部", "福岡", "由布院・阿蘇", "熊本・高千穗"];
    const CUISINES = [
      "全部",
      "水炊鍋・壽喜燒",
      "天婦羅",
      "燒鳥・居酒屋",
      "拉麵",
      "鐵板燒・和食・海鮮",
      "甜點・咖啡・伴手禮",
      "超市・百貨採買"
    ];

    function getAllRestaurants() {
      const defaults = DEFAULT_TRIP_DATA.restaurants.filter(
        (r) => !appState.hiddenDefaultRestaurants.includes(r.id)
      );
      return [...defaults, ...appState.customRestaurants];
    }

    function selectRegion(region) {
      selectedRegion = region;
      renderRestaurants();
    }

    function selectCuisine(cuisine) {
      selectedCuisine = cuisine;
      renderRestaurants();
    }

    function updateRestaurantSearch(val) {
      restaurantSearchQuery = val;
      renderRestaurantGridOnly();
    }

    function openRestaurantModal(restId = null) {
      const form = document.getElementById("restaurantForm");
      form.reset();
      document.getElementById("restId").value = "";
      document.getElementById("restModalTitle").textContent = "新增私房餐廳";

      if (restId) {
        const r = getAllRestaurants().find((item) => item.id === restId);
        if (r) {
          document.getElementById("restModalTitle").textContent = "編輯餐廳資訊";
          document.getElementById("restId").value = r.id;
          document.getElementById("restName").value = r.name || "";
          document.getElementById("restRegion").value = r.region || "福岡";
          document.getElementById("restCuisine").value = r.cuisine || "鐵板燒・和食・海鮮";
          document.getElementById("restPrice").value = r.price || "";
          document.getElementById("restRating").value = r.rating || "";
          document.getElementById("restHours").value = r.hours || "";
          document.getElementById("restClosed").value = r.closed || "";
          document.getElementById("restDishes").value = r.dishes || "";
          document.getElementById("restTravel").value = r.travelTime || "";
          document.getElementById("restMapUrl").value = r.mapUrl || "";
        }
      }
      document.getElementById("restaurantModal").classList.remove("hidden");
    }

    function closeRestaurantModal() {
      document.getElementById("restaurantModal").classList.add("hidden");
    }

    function saveRestaurantForm(e) {
      e.preventDefault();
      const id = document.getElementById("restId").value;
      const payload = {
        id: id || `custom-r-${Date.now()}`,
        name: document.getElementById("restName").value.trim(),
        region: document.getElementById("restRegion").value,
        cuisine: document.getElementById("restCuisine").value,
        rating: document.getElementById("restRating").value.trim(),
        price: document.getElementById("restPrice").value.trim() || "待確認",
        hours: document.getElementById("restHours").value.trim() || "待確認",
        closed: document.getElementById("restClosed").value.trim() || "待確認",
        dishes: document.getElementById("restDishes").value.trim() || "待確認",
        travelTime: document.getElementById("restTravel").value.trim() || "待確認",
        mapUrl:
          document.getElementById("restMapUrl").value.trim() ||
          `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(document.getElementById("restName").value.trim())}`,
        isDefault: false
      };

      const isEditingDefault = DEFAULT_TRIP_DATA.restaurants.some((r) => r.id === id);
      if (isEditingDefault) {
        if (!appState.hiddenDefaultRestaurants.includes(id)) {
          appState.hiddenDefaultRestaurants.push(id);
        }
        payload.id = `edited-${id}-${Date.now()}`;
        appState.customRestaurants.unshift(payload);
      } else {
        const idx = appState.customRestaurants.findIndex((r) => r.id === id);
        if (idx >= 0) appState.customRestaurants[idx] = payload;
        else appState.customRestaurants.unshift(payload);
      }

      saveState();
      closeRestaurantModal();
      renderRestaurants();
      showToast("🍽️ 餐廳已儲存");
    }

    function deleteRestaurant(id, isDefault) {
      openConfirmModal("移除餐廳", "確定要從餐廳清單移除這家店嗎？", () => {
        if (isDefault) {
          if (!appState.hiddenDefaultRestaurants.includes(id)) {
            appState.hiddenDefaultRestaurants.push(id);
          }
        } else {
          appState.customRestaurants = appState.customRestaurants.filter((r) => r.id !== id);
        }
        saveState();
        renderRestaurants();
        showToast("已移除餐廳");
      });
    }

    function getFilteredRestaurants() {
      const q = restaurantSearchQuery.trim().toLowerCase();
      return getAllRestaurants().filter((r) => {
        const matchRegion = selectedRegion === "全部" || r.region === selectedRegion;
        const matchCuisine = selectedCuisine === "全部" || (r.cuisine || "鐵板燒・和食・海鮮") === selectedCuisine;
        const matchQuery =
          !q ||
          (r.name || "").toLowerCase().includes(q) ||
          (r.dishes || "").toLowerCase().includes(q) ||
          (r.travelTime || "").toLowerCase().includes(q) ||
          (r.cuisine || "").toLowerCase().includes(q);
        return matchRegion && matchCuisine && matchQuery;
      });
    }

    function renderRestaurants() {

       8. 視圖四：旅行預算 (Budget Manager)
       ========================================================================= */
    const CATEGORIES = ["餐飲", "購物", "景點門票", "其他支出"];
    const DAY_OPTIONS = [
      "行前預付",
      "Day 1 (11/23)",
      "Day 2 (11/24)",
      "Day 3 (11/25)",
      "Day 4 (11/26)",
      "Day 5 (11/27)",
      "Day 6 (11/28)"
    ];

    function toTWD(amount, currency) {
      const val = Number(amount) || 0;
      return currency === "JPY" ? Math.round(val * appState.exchangeRate) : Math.round(val);
    }

    function updateExchangeRate(val) {
      const num = parseFloat(val);
      if (num > 0 && num < 10) {
        appState.exchangeRate = num;
        saveState();
        renderBudget();
      }
    }

    function updateTravelerName(idx, val) {
      const clean = val.trim() || `旅伴 ${idx + 1}`;
      const oldName = appState.travelers[idx];
      appState.travelers[idx] = clean;
      appState.expenses.forEach((exp) => {
        if (exp.payer === oldName) exp.payer = clean;
      });
      saveState();
      renderBudget();
    }

    function saveExpenseForm(e) {
      e.preventDefault();
      const name = document.getElementById("expName").value.trim();
      const amount = parseFloat(document.getElementById("expAmount").value);
      if (!name || isNaN(amount) || amount <= 0) {
        showToast("請輸入正確的項目名稱與金額");
        return;
      }

      const payload = {
        id: editingExpenseId || `exp-${Date.now()}`,
        day: document.getElementById("expDay").value,
        name,
        category: document.getElementById("expCategory").value,
        amount,
        currency: document.getElementById("expCurrency").value,
        payer: document.getElementById("expPayer").value,
        note: document.getElementById("expNote").value.trim()
      };

      if (editingExpenseId) {
        const idx = appState.expenses.findIndex((x) => x.id === editingExpenseId);
        if (idx >= 0) appState.expenses[idx] = payload;
        editingExpenseId = null;
        showToast("✏️ 已更新支出紀錄");
      } else {
        appState.expenses.unshift(payload);
        showToast("💴 已新增支出紀錄");
      }

      saveState();
      renderBudget();
    }

    function editExpense(id) {
      editingExpenseId = id;
      renderBudget();
      document.getElementById("budgetFormSection")?.scrollIntoView({ behavior: "smooth" });
    }

    function cancelEditExpense() {
      editingExpenseId = null;
      renderBudget();
    }

    function deleteExpense(id) {
      openConfirmModal("刪除支出", "確定要刪除這筆支出紀錄嗎？", () => {
        appState.expenses = appState.expenses.filter((x) => x.id !== id);
        if (editingExpenseId === id) editingExpenseId = null;
        saveState();
        renderBudget();
        showToast("已刪除支出紀錄");
      });
    }

    function weatherCodeToDesc(code) {
      if (code === 0) return { icon: "☀️", text: "晴朗" };
      if ([1, 2, 3].includes(code)) return { icon: "⛅", text: "多雲時晴" };
      if ([45, 48].includes(code)) return { icon: "🌫️", text: "有霧" };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: "🌧️", text: "有雨" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "❄️", text: "降雪" };
      if ([95, 96, 99].includes(code)) return { icon: "⛈️", text: "雷陣雨" };
      return { icon: "🌤️", text: "多雲" };
    }

    async function fetchAllKyushuWeather(force = false) {
      if (weatherCache && !force) return weatherCache;
      const results = await Promise.all(
        DEFAULT_TRIP_DATA.weatherCities.map(async (c) => {
          try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("API error");
            const data = await res.json();
            return { ...c, ok: true, data };
          } catch (e) {
            return { ...c, ok: false };
          }
        })
      );
      weatherCache = results;
      return results;
    }

    function openBackupModal() {
      document.getElementById("backupModal").classList.remove("hidden");
    }

    function closeBackupModal() {
      document.getElementById("backupModal").classList.add("hidden");
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "kyushu-travel-journal-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("⬇️ 備份檔已下載");
    }

    function importBackupJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          appState = { ...createInitialState(), ...parsed };
          saveState();
          closeBackupModal();
          renderCurrentView();
          showToast("✅ 備份資料已成功還原");
        } catch (err) {
          showToast("⚠️ 備份檔格式不正確，請確認檔案");
        }
      };
      reader.readAsText(file);
    }

    function confirmResetAll() {
      closeBackupModal();
      openConfirmModal(
        "重置所有資料",
        "這會清除您自行新增的支出、備忘錄與餐廳，並還原為初始預設行程，確定要重置嗎？",
        () => {
          localStorage.removeItem(STORAGE_KEY);
          appState = createInitialState();
          renderCurrentView();
          showToast("已重置為預設旅遊手冊");
        }
      );
    }

    /* =========================================================================
       11. 初始化啟動
       ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      updateNavStyles();
      renderHome();
    });
  </script>
</body>
</html>
